<!DOCTYPE html>
<html>

<head>
    <title>Practice Timer</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <link rel="stylesheet" href="./css/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

</head>

<body style="background-color: #282a3a;">
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="my-3 text-center float-sm-end">

                    <h1 class="timer-1" id="main-timer-id">00<span style="font-family: Arial, Helvetica, sans-serif;">:</span>00<span style="font-family: Arial, Helvetica, sans-serif;">:</span>00</h1>
                </div>
            </div>
        </div>
        <form>
            <div class="row col-sm-6 mx-auto timer-form ">
                <div class="col-12 text-center mb-3">
                    <button type="button" class="btn btn-outline-info timer-btn btns" onclick="startmain();">Start Timer</button>
                </div>
                <div class="d-flex form-controls border-0" style="background-color: transparent;">
                    <div class="col">
                        <div class="mx-2">

                            <input type="number" name="h0" id="t1" class="form-control bg-transparent" placeholder="H"
                                maxlength="1" min="0" max="9" onkeyup="autoTab(this, 't2');" />
                        </div>
                    </div>
                    <div class="col">
                        <div class="mx-2">

                            <input type="number" name="h1" id="t2" class="form-control bg-transparent" placeholder="H"
                                maxlength="1" min="0" max="9" onkeyup="autoTab(this, 't3');"
                                onkeydown="handleBackspace(this, 't1', event);" />
                        </div>
                    </div>
                    <span style="color: white;
                font-size: 28px;
                font-weight: bold;
                background-color: transparent;
                height: auto;
                text-align: center;">:</span>
                    <div class="col">
                        <div class="mx-2">

                            <input type="number" name="m0" id="t3" class="form-control bg-transparent" placeholder="M"
                                maxlength="1" min="0" max="6" onkeyup="autoTab(this, 't4');"
                                onkeydown="handleBackspace(this, 't2', event);" />
                        </div>
                    </div>
                    <div class="col">
                        <div class="mx-2">

                            <input type="number" name="m1" id="t4" class="form-control bg-transparent" placeholder="M"
                                maxlength="1" min="0" max="9" onkeyup="autoTab(this, 't5');"
                                onkeydown="handleBackspace(this, 't3', event);" />
                        </div>
                    </div>
                    <span style="color: white;
                font-size: 28px;
                font-weight: bold;
                background-color: transparent;
                height: auto;
                text-align: center;">:</span>
                    <div class="col">
                        <div class="mx-2">

                            <input type="number" name="s0" id="t5" class="form-control bg-transparent" placeholder="S"
                                maxlength="1" min="0" max="6" onkeyup="autoTab(this, 't6');"
                                onkeydown="handleBackspace(this, 't4', event);" />
                        </div>
                    </div>
                    <div class="col">
                        <div class="mx-2">

                            <input type="number" name="s1" id="t6" class="form-control bg-transparent" placeholder="S"
                                maxlength="1" min="0" max="9" onkeydown="handleBackspace(this, 't5', event);" />
                        </div>
                    </div>

                </div>
            </div>
            
        </form>

    <div class="col-12">
                <h1 class="main-timer text-center" id="timer-id">05:00</h1>
            </div>

    </div>
    <div class="row my-2 mx-auto">
        
        <div class="row col-sm-10 my-2 mx-auto align-content-center">
            <div class="col-sm-12 text-center">
                <h4 class="text">Intervals</h4>
            </div>
            <div class="w-100"></div>
            <div class="col d-flex flex-wrap flex-sm-none justify-content-sm-center">
                <div class="d-inline py-1 my-auto mx-1 px-sm-2 buttons">
                    <button type="button" class="btn btn-outline-success btns btn1" name="interval"
                        value="60" onclick="startCustomTimer(60)">1:00</button>
                </div>
                <div class="d-inline py-1 my-auto mx-1 px-sm-2 buttons">
                    <button type="button" class="btn btn-outline-success btns btn2" name="interval"
                        value="90" onclick="startCustomTimer(90)">1:30</button>
                </div>
                <div class="d-inline py-1 my-auto mx-1 px-sm-2 buttons">
                    <button type="button" class="btn btn-outline-success btns btn3" name="interval"
                        value="120" onclick="startCustomTimer(120)">2:00</button>
                </div>
                <div class="d-inline py-1 my-auto mx-1 px-sm-2 buttons">
                    <button type="button" class="btn btn-outline-success btns btn4" name="interval"
                        value="150" onclick="startCustomTimer(150)">2:30</button>
                </div>
                <div class="d-inline py-1 my-auto mx-1 px-sm-2 buttons">
                    <button type="button" class="btn btn-outline-success btns btn5" name="interval"
                        value="180" onclick="startCustomTimer(180)">3:00</button>
                </div>
                <div class="d-inline py-1 my-auto mx-1 px-sm-2 buttons">
                    <button type="button" class="btn btn-outline-success btns btn6" name="interval"
                        value="210" onclick="startCustomTimer(210)">3:30</button>
                </div>
                <div class="d-inline py-1 my-auto mx-1 px-sm-2 buttons">
                    <button type="button" class="btn btn-outline-success btns btn7" name="interval"
                        value="240" onclick="startCustomTimer(240)">4:00</button>
                </div>
                <button type="button" class="hidden-btn" hidden></button>
            </div>
            <div class="col-sm-12 text-center mt-3">
                <a href="#" class="info-link"><h4 class="info-link">How To Use?</h4></a>
            </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
    <script type="application/javascript" src="./js/main.js"></script>

    <script>
        function autoTab(currentInput, nextInputId) {
            var maxLength = parseInt($(currentInput).attr('maxlength'));
            var currentLength = $(currentInput).val().length;

            if (currentLength === maxLength) {
                // Find the next input field by ID
                var nextInput = $('#' + nextInputId);

                // If there is a next input field, focus on it
                if (nextInput.length > 0) {
                    nextInput.focus();
                }
            }
        }
        if (event.keyCode === 8 && currentLength === 0) {
            var prevInput = $('#' + nextInputId).prev('.form-control');

            if (prevInput.length > 0) {
                prevInput.val('').focus();
            }
        }


        function handleBackspace(currentInput, prevInputId, event) {
            if (event.keyCode === 8 && $(currentInput).val().length === 0) {
                var prevInput = $('#' + prevInputId);

                if (prevInput.length > 0) {
                    prevInput.val('').focus();
                }}}
    </script>
</body>

</html>
